[pytest]
# Tests live in backend/tests and import backend modules by their flat module
# names (e.g. `import analyzer`), matching how the application imports them at
# runtime (app.py does `from projects import router`). conftest.py puts the
# backend directory on sys.path so that works under pytest too.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: async test functions are collected without needing an
# explicit marker on every one.
asyncio_mode = auto

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    requires_aws: needs real AWS credentials and billable services; deselected by default.
    requires_ffmpeg: needs the FFmpeg executable on PATH.
    requires_mongodb: needs a reachable MongoDB instance; set MONGODB_TEST_URL to a disposable test database. Deselected by default.
