AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  NovaFlow / Brand Guardian - S3 bucket and DynamoDB tables for the video
  compliance pipeline. Phase 4.1.

  WHAT THIS IS
  ------------
  Before this template there was no infrastructure-as-code for the resources
  the application requires: the DynamoDB tables had to be created by hand from
  a prose description, and infra/init_s3.py created two differently-named
  buckets with no public-access block, no encryption, and no TLS enforcement.
  Everything here is derived from the boto3 calls the code actually makes and
  from backend/aws_resources.py, which is the single place resource names and
  object prefixes are defined.

  CloudFormation rather than a new framework: the project has no IaC tooling at
  all, and introducing Terraform or CDK would mean a toolchain, a state store,
  and a bootstrap process for three resources. This is one declarative file
  deployable with the AWS CLI already required to use the service.

  NOT DEPLOYED. No stack was created, no resource was provisioned, and no live
  AWS call was made while writing this. Every name is a parameter with a
  placeholder default; nothing here invents an account id or a real bucket
  name.

  TO DEPLOY (an operator action, under administrative credentials):

    aws cloudformation deploy \
      --template-file infra/cloudformation/storage.yaml \
      --stack-name novaflow-storage \
      --parameter-overrides \
          MediaBucketName=<globally-unique-bucket-name> \
          Environment=staging \
      --capabilities CAPABILITY_NAMED_IAM

  Then set S3_BUCKET_NAME, DYNAMODB_TABLE_NAME, and DYNAMODB_PROJECTS_TABLE in
  the application environment to the stack outputs. See
  docs/PIPELINE_OPERATIONS.md.

Parameters:

  MediaBucketName:
    Type: String
    Description: >-
      Bucket for source videos, extracted frames, and agent reel uploads. S3
      bucket names are globally unique, so this has no default - a default
      would either collide with someone else or invent a name.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: must be a valid S3 bucket name (lowercase, 3-63 chars)

  FramesTableName:
    Type: String
    Default: NovaFlowFrames
    Description: >-
      Frame metadata and per-frame detections. Must match DYNAMODB_TABLE_NAME.
      The default is the name the application already uses, so an existing
      deployment is unaffected.

  ProjectsTableName:
    Type: String
    Default: NovaFlowProjects
    Description: >-
      Projects and their submissions. Must match DYNAMODB_PROJECTS_TABLE.

  Environment:
    Type: String
    Default: staging
    AllowedValues: [development, staging, production]
    Description: Tag value only; this template provisions one environment per stack.

  SourceRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: >-
      Days to keep an uploaded source video. This is a data-retention decision,
      not a technical one: it bounds how long a user video the service no
      longer needs stays in the bucket. The pipeline never deletes a source
      object itself (a retry needs it), so this rule is the only thing that
      expires them.

  FrameRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: >-
      Days to keep extracted frame JPEGs. Shorter than the source by default:
      frames are derived data and can be regenerated by re-running analysis,
      and they are the bulk of the object count.

  NoncurrentVersionRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: >-
      Versioning is on so an overwritten object is recoverable, but old
      versions must expire or the bucket grows without bound.

  EnableAccessLogging:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Create a separate log bucket and record every object access. Needed to
      answer "who read this user video", and off by default because it is a
      second bucket with its own cost. Turn it on for production.

  PointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Continuous backups for both tables. On by default: the frames table holds
      analysis results that cost Bedrock spend to reproduce.

Conditions:

  WithAccessLogging: !Equals [!Ref EnableAccessLogging, "true"]
  WithPitr: !Equals [!Ref PointInTimeRecovery, "true"]

Resources:

  # -------------------------------------------------------------------------
  # S3
  # -------------------------------------------------------------------------

  AccessLogBucket:
    Type: AWS::S3::Bucket
    Condition: WithAccessLogging
    # Retained on stack deletion: access logs are the audit trail, and the
    # stack that produced them is exactly what an investigation looks at.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${MediaBucketName}-access-logs"
      AccessControl: LogDeliveryWrite
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Application
          Value: novaflow
        - Key: Environment
          Value: !Ref Environment

  MediaBucket:
    Type: AWS::S3::Bucket
    # Retained deliberately. This bucket holds user-uploaded video; a stack
    # delete must not be able to destroy it as a side effect.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref MediaBucketName

      # Nothing in this application serves an object directly from S3: the
      # media route streams through an authenticated endpoint. Public access
      # is therefore blocked at every level.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # Disables ACLs entirely, so the only way to grant access is a policy.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            # Cheaper and faster for a bucket written one object at a time.
            BucketKeyEnabled: true

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:
          # One rule per prefix in backend/aws_resources.MANAGED_PREFIXES.
          - Id: ExpireSourceVideos
            Status: Enabled
            Prefix: sources/
            ExpirationInDays: !Ref SourceRetentionDays

          - Id: ExpireExtractedFrames
            Status: Enabled
            Prefix: frames/
            ExpirationInDays: !Ref FrameRetentionDays

          - Id: ExpireAgentReelUploads
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref SourceRetentionDays

          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionRetentionDays

          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

      LoggingConfiguration: !If
        - WithAccessLogging
        - DestinationBucketName: !Ref AccessLogBucket
          LogFilePrefix: media-access/
        - !Ref AWS::NoValue

      Tags:
        - Key: Application
          Value: novaflow
        - Key: Environment
          Value: !Ref Environment

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Enforced at the bucket, not only in the role policy, so the
          # constraint does not depend on the caller carrying it.
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${MediaBucket}"
              - !Sub "arn:${AWS::Partition}:s3:::${MediaBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            Resource: !Sub "arn:${AWS::Partition}:s3:::${MediaBucket}/*"
            Condition:
              StringNotEquals:
                "s3:x-amz-server-side-encryption": "AES256"

  # -------------------------------------------------------------------------
  # DynamoDB
  # -------------------------------------------------------------------------

  FramesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref FramesTableName

      # Key schema exactly as the code uses it:
      #   extractor.put_item          Key {video_id, frame_number}
      #   analyzer.update_item        Key {video_id, frame_number}
      #   analyzer.delete_frames_from Query video_id + frame_number >= n
      #   app.py /violations          Query video_id, paged on frame_number
      #
      # The composite key is what makes a re-run idempotent: the same frame
      # overwrites rather than appending, and pruning can target a frame-number
      # range.
      AttributeDefinitions:
        - AttributeName: video_id
          AttributeType: S
        - AttributeName: frame_number
          AttributeType: N
      KeySchema:
        - AttributeName: video_id
          KeyType: HASH
        - AttributeName: frame_number
          KeyType: RANGE

      # On-demand: analysis traffic is bursty by nature (one upload produces up
      # to MAX_FRAMES_PER_VIDEO writes in a few seconds, then nothing), which
      # is the case provisioned capacity handles worst.
      BillingMode: PAY_PER_REQUEST

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [WithPitr, true, false]

      SSESpecification:
        # AWS-owned key. Set SSEType/KMSMasterKeyId for a CMK if required.
        SSEEnabled: true

      # NO TTL. Frame rows are the analysis result; a user who re-opens a
      # finished audit must still see its detections, and an expiry would make
      # a completed report silently empty. Frames are pruned explicitly by
      # analyzer.delete_frames_from and expire with the bucket lifecycle rule.

      # NO GSI yet. analyzer.check_pending_frames uses a filtered Scan, which
      # is a known shortcut recorded in docs/PROJECT_AUDIT.md. A GSI on
      # (status) would replace it; adding one here before the query changes
      # would be paying for an index nothing reads.

      Tags:
        - Key: Application
          Value: novaflow
        - Key: Environment
          Value: !Ref Environment

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ProjectsTableName

      # projects.py: PK project_id, SK sk. The sort key carries the item type
      # ("meta", a submission id), which is how one project and its
      # submissions are fetched in a single query.
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

      BillingMode: PAY_PER_REQUEST

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [WithPitr, true, false]

      SSESpecification:
        SSEEnabled: true

      # NO GSI. The marketplace listing uses a Scan, also a recorded shortcut.
      # A GSI on (agent_id) or (status) is the fix when that query is revised.

      Tags:
        - Key: Application
          Value: novaflow
        - Key: Environment
          Value: !Ref Environment

Outputs:

  MediaBucketNameOut:
    Description: Set S3_BUCKET_NAME to this value.
    Value: !Ref MediaBucket
    Export:
      Name: !Sub "${AWS::StackName}-MediaBucket"

  FramesTableNameOut:
    Description: Set DYNAMODB_TABLE_NAME to this value.
    Value: !Ref FramesTable
    Export:
      Name: !Sub "${AWS::StackName}-FramesTable"

  ProjectsTableNameOut:
    Description: Set DYNAMODB_PROJECTS_TABLE to this value.
    Value: !Ref ProjectsTable
    Export:
      Name: !Sub "${AWS::StackName}-ProjectsTable"

  FramesTableArn:
    Description: Substitute into the IAM template placeholder for the frames table.
    Value: !GetAtt FramesTable.Arn

  ProjectsTableArn:
    Description: Substitute into the IAM template placeholder for the projects table.
    Value: !GetAtt ProjectsTable.Arn

  AccessLogBucketNameOut:
    Condition: WithAccessLogging
    Description: Bucket receiving S3 server access logs.
    Value: !Ref AccessLogBucket
